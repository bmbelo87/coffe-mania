# Litestream para o Render (plano Free, container Docker).
# Copia o SQLite do PocketBase continuamente para um bucket S3-compatível (Cloudflare R2, Backblaze B2…),
# para que o save sobreviva a reinícios e reimplantações do container.
#
# Variáveis no painel do Render (Environment):
#   LITESTREAM_BUCKET            nome do bucket (ex.: cafe-mania-backup)
#   LITESTREAM_ENDPOINT          endpoint S3 (ex.: https://SUA-CONTA.r2.cloudflarestorage.com)
#   LITESTREAM_ACCESS_KEY_ID     chave de acesso (lida automaticamente pelo Litestream)
#   LITESTREAM_SECRET_ACCESS_KEY chave secreta (lida automaticamente pelo Litestream)
#
# Sem LITESTREAM_BUCKET/LITESTREAM_ENDPOINT, o entrypoint não usa esta configuração e o servidor
# sobe como antes (sem backup).
dbs:
  - path: /app/pb_data/data.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: data.db
        endpoint: ${LITESTREAM_ENDPOINT}
        region: auto
        retention: 168h
        snapshot-interval: 6h
  - path: /app/pb_data/auxiliary.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: auxiliary.db
        endpoint: ${LITESTREAM_ENDPOINT}
        region: auto
        retention: 168h
        snapshot-interval: 24h
